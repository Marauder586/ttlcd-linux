[package]
name = "ttlcd-rs"
version = "0.14.0"
edition = "2021"
description = "Driver and display suite for XinWeiYe/Thermaltake USB LCD panels (480×480)"

[lib]
name = "ttlcd"
path = "src/lib.rs"

[[bin]]
name = "ttlcd"
path = "src/bin/ttlcd.rs"

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
env_logger  = "0.11"
log         = "0.4"
rusb        = "0.9"

# Image encode / decode
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }

# Drawing / text rendering
imageproc   = "0.26"
ab_glyph    = "0.2"

# System stats
sysinfo     = "0.35"

# Date / time
chrono      = { version = "0.4", features = ["clock"] }

# Async + web server
tokio       = { version = "1", features = ["full"] }
actix-web   = "4"
actix-multipart = "0.7"
futures-util = "0.3"

# Outbound HTTP (webhook forwarding)
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# QR code generation
qrcode      = "0.14"

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Config file
toml        = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
lto     = "thin"
strip   = true
opt-level = 3
