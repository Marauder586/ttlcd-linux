[package]
name = "ttlcd-rs"
version = "0.22.0"
edition = "2021"
description = "Driver and display suite for XinWeiYe/Thermaltake USB LCD panels (480×480)"

[lib]
name = "ttlcd"
path = "src/lib.rs"

[[bin]]
name = "ttlcd"
path = "src/bin/ttlcd/main.rs"

[lints]
workspace = true

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
env_logger  = "0.11"
log         = "0.4"
rusb        = "0.9"

# Image encode / decode
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }

# Drawing / text rendering
imageproc   = "0.26"
ab_glyph    = "0.2"

# System stats
sysinfo     = "0.35"

# Date / time
chrono      = { version = "0.4", features = ["clock"] }

# Async + web server
tokio       = { version = "1", features = ["full"] }
actix-web   = "4"
actix-multipart = "0.7"
futures-util = "0.3"

# Outbound HTTP (webhook forwarding)
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# QR code generation
qrcode      = "0.14"

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Config file
toml        = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
lto     = "thin"
strip   = true
opt-level = 3

# The web UI is a separate crate built for wasm32 (see scripts/build-web.sh).
# It is not a default member, so plain `cargo build` / `cargo test` at the
# root still mean the driver and daemon.
[workspace]
members = [".", "web"]
default-members = ["."]

# Lints shared by both crates; each opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Clippy's default groups (correctness, suspicious, style, complexity, perf).
all = { level = "warn", priority = -1 }
# Leftovers that should not be committed.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A few pedantic lints that catch real slips or keep the code plain.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release.package.ttlcd-web]
opt-level = "s"
